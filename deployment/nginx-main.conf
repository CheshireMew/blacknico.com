# Include inside the existing blacknico.com/www HTTPS server block.
# TLS certificates and unrelated virtual hosts remain in the server configuration.
root /srv/blacknico.com/current/site;
charset utf-8;
error_page 404 /404.html;
add_header Cache-Control "no-cache" always;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

if ($host = www.blacknico.com) {
    return 301 https://blacknico.com$request_uri;
}

# Use the original request URI to avoid redirecting Nginx's internal index lookup.
if ($request_uri ~ "^/index[.]html(?:[?]|$)") {
    return 301 https://blacknico.com/$is_args$args;
}
if ($request_uri ~ "^/projects/index[.]html(?:[?]|$)") {
    return 301 https://blacknico.com/projects/$is_args$args;
}
if ($request_uri ~ "^/invite/index[.]html(?:[?]|$)") {
    return 301 https://blacknico.com/invite/$is_args$args;
}

location = /projects {
    return 301 https://blacknico.com/projects/$is_args$args;
}
location = /invite {
    return 301 https://blacknico.com/invite/$is_args$args;
}
